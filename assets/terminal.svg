<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace;font-size:16px}
.t{fill:#f4f1f1}.p{fill:#e5243b}.ok{fill:#f4f1f1}.k{fill:#a39a9b}.v{fill:#ffffff}
.l{animation:in .35s ease-out both}
