<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06120d"/><stop offset="1" stop-color="#0b2a1d"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00e08a" stop-opacity=".5"/><stop offset="1" stop-color="#00e08a" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00e08a" stroke-opacity=".08"/></pattern>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e08a" stop-opacity="0"/><stop offset=".5" stop-color="#00e08a" stop-opacity=".3"/><stop offset="1" stop-color="#00e08a" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="300" rx="14"/></clipPath>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace}
.dim{fill:#79b79f;font-size:14px}.acc{fill:#00e08a}
.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.pulse{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}
.sweep{animation:s 7s linear infinite}@keyframes s{from{transform:translateX(-450px)}to{transform:translateX(1250px)}}
.float{animation:f 9s ease-in-out infinite}@keyframes f{50%{transform:translateY(-14px)}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#grid)"/>
<g class="float"><circle cx="1010" cy="140" r="200" fill="url(#glow)"/><circle cx="170" cy="260" r="140" fill="url(#glow)" opacity=".5"/></g>
<rect class="sweep" x="0" y="0" width="420" height="300" fill="url(#scan)"/>
</g>
<rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#00e08a" stroke-opacity=".22"/>
<g fill="none" stroke="#00e08a" stroke-width="2" stroke-opacity=".75"><path d="M22 52V22H52"/><path d="M1148 22H1178V52"/><path d="M22 248V278H52"/><path d="M1148 278H1178V248"/></g>
