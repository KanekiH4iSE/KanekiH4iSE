<path class="crack" d="M1101 133 L1072 128 L1046 142" stroke="#f2ecea" stroke-width="1" opacity=".45"/>
<path class="crack" d="M14 248 L52 226 L44 204 L88 180" stroke="#f2ecea" stroke-width="1" opacity=".3"/>
</g>
</g>
<rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#e5243b" stroke-opacity=".28"/>
<circle class="pulse" cx="34" cy="36" r="5" fill="#e5243b"/>
<text x="48" y="41" class="lbl">status: building<tspan class="blink" fill="#e5243b"> _</tspan></text>
<text x="1170" y="41" class="lbl" text-anchor="end">winner, EuroTech × Hong Kong 2026</text>

