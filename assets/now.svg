<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b0d"/><stop offset="1" stop-color="#0b0809"/></linearGradient><linearGradient id="runG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8f99"/><stop offset=".5" stop-color="#e5243b"/><stop offset="1" stop-color="#7a1020"/></linearGradient><filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace}.run{animation:run linear infinite}@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}.pulse{animation:pulse 2s ease-out infinite}@keyframes pulse{0%{r:4;opacity:.8}80%,100%{r:11;opacity:0}}.in{animation:in .6s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.run,.pulse,.in,.up,.blink{animation:none}}</style><rect x="1.0" y="1" width="518.0" height="248" rx="16" fill="url(#bg)"/><rect x="1.0" y="1" width="518.0" height="248" rx="16" fill="none" stroke="#e5243b" stroke-opacity=".22"/><rect class="run" style="animation-duration:7s;animation-delay:-0s" x="1.0" y="1" width="518.0" height="248" rx="16" pathLength="100" fill="none" stroke="url(#runG)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 86" filter="url(#glow)"/><rect x="537.0" y="1" width="662.0" height="248" rx="16" fill="url(#bg)"/><rect x="537.0" y="1" width="662.0" height="248" rx="16" fill="none" stroke="#e5243b" stroke-opacity=".22"/><rect class="run" style="animation-duration:8s;animation-delay:-3s" x="537.0" y="1" width="662.0" height="248" rx="16" pathLength="100" fill="none" stroke="url(#runG)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 86" filter="url(#glow)"/><text x="26" y="44" font-size="14" font-weight="700" fill="#e5243b">now</text><g class="in" style="animation-delay:0.20s"><circle cx="34" cy="83" r="4" fill="#e5243b"/><circle class="pulse" style="animation-delay:0.0s" cx="34" cy="83" r="4" fill="none" stroke="#e5243b"/><text x="52" y="88" font-size="15" font-weight="700" fill="#f4f1f1">Looking for a Werkstudent or internship</text><text x="52" y="109" font-size="12.5" fill="#a39a9b">backend · python · java · AI, Berlin or remote</text></g><g class="in" style="animation-delay:0.32s"><circle cx="34" cy="137" r="4" fill="#e5243b"/><circle class="pulse" style="animation-delay:0.6s" cx="34" cy="137" r="4" fill="none" stroke="#e5243b"/><text x="52" y="142" font-size="15" font-weight="700" fill="#f4f1f1">Debugging AI agents</text><text x="52" y="163" font-size="12.5" fill="#a39a9b">AutopsyGraph, failure forensics on Neo4j</text></g><g class="in" style="animation-delay:0.44s"><circle cx="34" cy="191" r="4" fill="#e5243b"/><circle class="pulse" style="animation-delay:1.2s" cx="34" cy="191" r="4" fill="none" stroke="#e5243b"/><text x="52" y="196" font-size="15" font-weight="700" fill="#f4f1f1">Keeping Магнат alive</text><text x="52" y="217" font-size="12.5" fill="#a39a9b">online multiplayer, live on Render</text></g><text x="562" y="44" font-size="14" font-weight="700" fill="#e5243b">what i care about</text><g class="in" style="animation-delay:0.30s"><text x="562" y="84" font-size="14.5" font-weight="700" fill="#f4f1f1"><tspan fill="#e5243b">› </tspan>Security, first-hand</text><text x="580" y="103" font-size="12.5" fill="#a39a9b">took apart MOVEit; broke Juice Shop on purpose</text></g><g class="in" style="animation-delay:0.40s"><text x="562" y="125" font-size="14.5" font-weight="700" fill="#f4f1f1"><tspan fill="#e5243b">› </tspan>AI is a power tool, not a crutch</text><text x="580" y="144" font-size="12.5" fill="#a39a9b">agents for speed, I still read every diff</text></g><g class="in" style="animation-delay:0.50s"><text x="562" y="166" font-size="14.5" font-weight="700" fill="#f4f1f1"><tspan fill="#e5243b">› </tspan>A live URL beats a perfect slide</text><text x="580" y="185" font-size="12.5" fill="#a39a9b">everything above with a red dot is running</text></g><g class="in" style="animation-delay:0.60s"><text x="562" y="207" font-size="14.5" font-weight="700" fill="#f4f1f1"><tspan fill="#e5243b">› </tspan>Design with taste</text><text x="580" y="226" font-size="12.5" fill="#a39a9b">if it looks like a template, I redo it</text></g></svg>
