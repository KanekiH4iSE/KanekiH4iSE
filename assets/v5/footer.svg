<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b0d"/><stop offset="1" stop-color="#0b0809"/></linearGradient><linearGradient id="runG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8f99"/><stop offset=".5" stop-color="#e5243b"/><stop offset="1" stop-color="#7a1020"/></linearGradient><linearGradient id="arcG" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#7a1020"/><stop offset="1" stop-color="#ff4d5e"/></linearGradient><linearGradient id="blood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a0006"/><stop offset=".45" stop-color="#b3101f"/><stop offset=".6" stop-color="#c8182a"/><stop offset="1" stop-color="#4a0006"/></linearGradient><filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@font-face{font-family:'KanekiDisplay';src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}.run{animation:run 8s linear infinite}@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}.arc{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 2.4s .4s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .8s ease-out forwards}@keyframes fade{to{opacity:1}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.bd{transform-box:fill-box;transform-origin:50% 0;animation:bd 4.5s cubic-bezier(.45,.02,.2,1) both}@keyframes bd{0%{transform:scaleY(0)}60%{transform:scaleY(.82)}100%{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){.run,.pu