<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b0d"/><stop offset="1" stop-color="#0b0809"/></linearGradient><linearGradient id="runG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8f99"/><stop offset=".5" stop-color="#e5243b"/><stop offset="1" stop-color="#7a1020"/></linearGradient><filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace}.run{animation:run linear infinite}@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}.pulse{animation:pulse 2s ease-out infinite}@keyframes pulse{0%{r:5;opacity:.8}80%,100%{r:12;opacity:0}}.in{animation:in .6s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.run,.pulse,.in{animation:none}}</style><rect x="1" y="1" width="598" height="248" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="598" height="248" rx="18" fill="none" stroke="#e5243b" stroke-opacity=".22"/><rect class="run" style="animation-duration:6s;animation-delay:-4.5s" x="1" y="1" width="598" height="248" rx="18" pathLength="100" fill="none" stroke="url(#runG)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 86" filter="url(#glow)"/><circle cx="38" cy="44" r="5" fill="#7a1020"/><text x="56" y="51" font-size="21" font-weight="800" fill="#f4f1f1">Quorum</text><rect x="487.2" y="29" width="86.8" height="26" rx="13" fill="#1a0b0d" fill-opacity="0.9" stroke="#e5243b" stroke-opacity=".55"/><text x="530.6" y="47" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ff8f99">voice AI</text><text class="in" style="animation-delay:0.10s" x="28" y="98" font-size="14.5" fill="#a39a9b">A voice AI API for group conversations: an agent that</text><text class="in" style="animation-delay:0.18s" x="28" y="122" font-size="14.5" fill="#a39a9b">follows several speakers at once and answers the group.</text><text class="in" style="animation-delay:0.26s" x="28" y="146" font-size="14.5" fill="#a39a9b">Built at the telli x LiveKit hackathon.</text><rect x="28.0" y="200" width="73.8" height="26" rx="7" fill="#0b0809" stroke="#f4f1f1" stroke-opacity=".14"/><text x="64.9" y="218" text-anchor="middle" font-size="12.5" fill="#f4f1f1" fill-opacity=".85">LiveKit</text><rect x="109.8" y="200" width="81.2" height="26" rx="7" fill="#0b0809" stroke="#f4f1f1" stroke-opacity=".14"/><text x="150.4" y="218" text-anchor="middle" font-size="12.5" fill="#f4f1f1" fill-opacity=".85">Deepgram</text><rect x="199.0" y="200" width="81.2" height="26" rx="7" fill="#0b0809" stroke="#f4f1f1" stroke-opacity=".14"/><text x="239.6" y="218" text-anchor="middle" font-size="12.5" fill="#f4f1f1" fill-opacity=".85">Cartesia</text><rect x="288.2" y="200" width="66.4" height="26" rx="7" fill="#0b0809" stroke="#f4f1f1" stroke-opacity=".14"/><text x="321.4" y="218" text-anchor="middle" font-size="12.5" fill="#f4f1f1" fill-opacity=".85">Claude</text></svg>
