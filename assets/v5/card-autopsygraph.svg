<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b0d"/><stop offset="1" stop-color="#0b0809"/></linearGradient><linearGradient id="runG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8f99"/><stop offset=".5" stop-color="#e5243b"/><stop offset="1" stop-color="#7a1020"/></linearGradient><filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:'JetBrains Mono','Fira Code',Consolas,'SFMono-Regular',Menlo,monospace}.run{animation:run linear infinite}@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}.pulse{animation:pulse 2s ease-out infinite}@keyframes pulse{0%{r:5;opacity:.8}80%,100%{r:12;opacity:0}}.in{animation:in .6s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.run,.pulse,.in{animation:none}}</style><rect x="1" y="1" width="598" height="248" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="598" height="248" rx="18" fill="none" stroke="#e5243b" stroke-opacity=".22"/><rect class="run" style="animation-duration:6s;animation-delay:-2.25s" x="1" y="1" width="598" height="248" rx="18" pathLength="100" fill="none" stroke="url(#runG)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 86" filter="url(#glow)"/><circle cx="38" cy="44" r="5" fill="#7a1020"/><text x="56" y="51" font-size="21" font-weight="800" fill="#f4f1f1">AutopsyGraph</text><rect x="449.2" y="29" width="124.8" height="26" rx="13" fill="#1a0b0d" fill-opacity="0.9" stroke="#e5243b" stroke-opacity=".55"/><text x="511.6" y="47" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ff8f99">built in 5.5h</text><text class="in" style="animation-delay:0.10s" x="28" y="98" font-size="14.5" fill="#a39a9b">Forensics for AI agents: records another agent&#x27;s runs as a</text><text class="in" style="animation-delay:0.18s" x="28" y="122" font-size="14.5" fill="#a39a9b">knowledge graph in Neo4j and explains why it failed. Built</text><text class="in" style="animation-delay:0.26s" x="28" y="146" font-size="14.5" fill="#a39a9b">at Graphs Gone Wild, NODES 2026.</text><rect x="28.0" y="200" width="66.4" height="26" rx="7" fill="#0b0809" stroke="#f4f1f1" stroke-opacity=".14"/><text x="61.2" y="218" text-anchor="middle" font-size="12.5" fill="#f4f1f1" fill-opacity=".85">Python</text><rect x="102.4" y="200" width="73.8" height="26" rx="7" fill="#0b0809" stroke="#f4f1f1" stroke-opacity=".14"/><text x="139.3" y="218" text-anchor="middle" font-size="12.5" fill="#f4f1f1" fill-opacity=".85">FastAPI</text><rect x="184.2" y="200" width="59.0" height="26" rx="7" fill="#0b0809" stroke="#f4f1f1" stroke-opacity=".14"/><text x="213.7" y="218" text-anchor="middle" font-size="12.5" fill="#f4f1f1" fill-opacity=".85">Neo4j</text><rect x="251.2" y="200" width="44.2" height="26" rx="7" fill="#0b0809" stroke="#f4f1f1" stroke-opacity=".14"/><text x="273.3" y="218" text-anchor="middle" font-size="12.5" fill="#f4f1f1" fill-opacity=".85">MCP</text></svg>
